[project]
name = "plantsense-migration-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]==3.3.6", "pytest==8.4.2"]

[project.optional-dependencies]
runtime-test = ["plantsense"]

[tool.uv.sources]
plantsense = { path = "../../backend", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
