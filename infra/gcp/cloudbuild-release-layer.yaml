# Reuse the already built, unchanged web and evaluated backend; add matching reports only.
steps:
  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: gcloud
    args: ['storage', 'cp', 'gs://${_REPORTS_BUCKET}/releases/${_FINGERPRINT}/investigation.json', 'gs://${_REPORTS_BUCKET}/releases/${_FINGERPRINT}/assistant.json', 'gs://${_REPORTS_BUCKET}/releases/${_FINGERPRINT}/cases.json', 'backend/release/']
  - name: gcr.io/cloud-builders/docker
    args: ['build', '--build-arg', 'BASE_IMAGE=${_BASE_IMAGE}', '-f', 'infra/gcp/release-layer.Dockerfile', '-t', '${_REGISTRY}/backend:${_TAG}', 'backend']
  - name: gcr.io/cloud-builders/docker
    args: ['pull', '${_WEB_IMAGE}']
  - name: gcr.io/cloud-builders/docker
    args: ['tag', '${_WEB_IMAGE}', '${_REGISTRY}/web:${_TAG}']
images: ['${_REGISTRY}/backend:${_TAG}', '${_REGISTRY}/web:${_TAG}']
substitutions:
  _REGISTRY: asia-south1-docker.pkg.dev/project-970d28ee-835b-4ca2-866/plantsense
  _REPORTS_BUCKET: project-970d28ee-835b-4ca2-866-plantsense-releases
  _FINGERPRINT: unset
  _BASE_IMAGE: unset
  _WEB_IMAGE: unset
  _TAG: unset
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 900s
