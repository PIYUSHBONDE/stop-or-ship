name: Validate PlantSense
on:
  push:
    branches-ignore: [f_statistics-main-integration]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_browser:
        description: Skip the full packaged browser matrix for prototype releases
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: plantsense_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PLANTSENSE_TEST_POSTGRES_DSN: postgresql://postgres@127.0.0.1:5432/plantsense_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.23"
          enable-cache: false
      - run: uv sync --frozen --extra runtime-test --project infra/postgres
      - run: uv run --extra runtime-test --project infra/postgres pytest infra/postgres -q
      - run: uv run --extra runtime-test --project infra/postgres pytest backend/tests/integration/test_postgres_runtime.py -q

  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.23"
          # Avoid setup-uv's post-job cache prune racing another uv cleanup process.
          # The locked sync remains deterministic; npm keeps its separate cache.
          enable-cache: false
      - run: uv sync --frozen --extra dev --project backend
      - run: uv run --project backend pytest backend/tests -q
      - run: uv run --project backend pytest infra/gcp/tests -q
      - run: uv run --project backend ruff check backend/app backend/scripts backend/tests
      - run: uv run --project backend ruff format --check backend/app backend/scripts backend/tests
      - run: uv run --project backend ruff check scripts infra/postgres infra/gcp
      - run: uv run --project backend ruff format --check scripts infra/postgres infra/gcp
      - run: |
          uv export --project backend --frozen --no-dev --no-emit-project --output-file /tmp/runtime-requirements.txt
          uvx --from pip-audit==2.9.0 python -m pip_audit --disable-pip --require-hashes -r /tmp/runtime-requirements.txt
      - run: uv run --project backend python backend/scripts/contracts/export_openapi.py --check
      - run: npm ci
        working-directory: web
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - run: npm run check:api
        working-directory: web
      - run: npm run format:check && npm run typecheck && npm run lint && npm run build
        working-directory: web
      # Full browser acceptance runs once against the packaged containers below.
      - run: npm run test:unit
        working-directory: web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-results
          path: |
            web/test-results
            docs/artifacts/*.png

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        shell: bash
        run: |
          curl -fsSL --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --log-opts='--all' --no-banner

  containers:
    if: ${{ !inputs.skip_browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 120
      - run: python3 scripts/check_containers.py
      - name: Start explicitly isolated browser fixtures
        run: docker compose -f compose.yaml -f .github/compose.browser-fixture.yaml up --build --wait --wait-timeout 120
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:unit && npm run test:e2e -- --grep-invert product-telemetry.spec.ts --max-failures=1 --shard=${{ matrix.shard }}/3
        working-directory: web
      - name: Start separate operational browser fixtures
        if: matrix.shard == 1
        run: |
          docker compose -f compose.yaml -f .github/compose.browser-fixture.yaml stop case-worker api
          docker compose -f compose.yaml -f .github/compose.operational-browser.yaml up --wait --wait-timeout 120
      - run: npx playwright test tests/e2e/product-telemetry.spec.ts --max-failures=1
        if: matrix.shard == 1
        working-directory: web
      - name: Container diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=100
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: container-browser-results-${{ matrix.shard }}
          path: web/test-results
      - run: docker compose -f compose.yaml -f .github/compose.browser-fixture.yaml down
        if: always()
