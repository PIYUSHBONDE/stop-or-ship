[project]
name = "plantsense"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]==3.3.6",
  "fastapi>=0.133,<0.140",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "httpx>=0.28,<1",
  "google-adk==2.11.0",
  "google-cloud-firestore>=2.20,<3",
  "google-cloud-tasks>=2.19,<3",
  "google-cloud-storage>=2.19,<4",
  "firebase-admin>=6.6,<8",
  "google-auth>=2.35,<3",
  "mcp==1.30.0",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "reportlab>=4,<5"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
