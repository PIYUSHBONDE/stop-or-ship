name: plantsense

services:
  api:
    build:
      context: ./backend
    environment:
      PLANTSENSE_MODE: local
      PLANTSENSE_AI_PROVIDER: scripted
      SERVICE_ROLE: api
      PLANTSENSE_DB: /var/lib/plantsense/local.db
      DAILY_AI_LIMIT: "60"
      PORT: "8080"
    volumes:
      - plant-data:/var/lib/plantsense
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ./web
    environment:
      API_BASE_URL: http://api:8080
      PORT: "8080"
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${PLANTSENSE_WEB_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/.next/cache:rw,noexec,nosuid,size=64m,uid=1000,gid=1000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  plant-data:
